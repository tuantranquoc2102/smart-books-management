version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes: [ "dbdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app -d books"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports: ["8081:8081"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./     # hoặc ./backend nếu bạn để code trong thư mục con
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/books
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
    command: ["java","-jar","/app/app.jar"]

volumes:
  dbdata: